name: Build Zona de Prueba APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'ATTRIBUTION.md'
      - 'README.md'
      - 'project.godot'
      - 'Main.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Import project files
        run: godot --headless --editor --path . --import --quit
      - name: Validate imported 3D assets
        run: godot --headless --path . --script res://scripts/asset_check.gd
      - name: Validate ragdoll physics setup
        run: godot --headless --path . --script res://scripts/ragdoll_check.gd
      - name: Smoke test scene
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --quit-after 8 --verbose 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error parsing|ERROR:|WARNING:.*Invalid' smoke.log; then exit 1; fi
      - name: Export APK
        id: export
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-debug 'Android' build/ZonaDePrueba.apk --verbose 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          echo "EXPORT_EXIT=$code"
          if [ "$code" -eq 0 ] && [ -s build/ZonaDePrueba.apk ]; then echo "apk=true" >> "$GITHUB_OUTPUT"; else echo "apk=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZonaDePrueba-build-logs
          path: |
            smoke.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.export.outputs.apk == 'true'
        with:
          name: ZonaDePrueba-Android-APK
          path: build/ZonaDePrueba.apk
          retention-days: 30
      - name: Fail if APK export failed
        if: steps.export.outputs.apk != 'true'
        run: exit 1
