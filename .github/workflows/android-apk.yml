name: Build Zona de Prueba APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'project.godot'
      - 'Main.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Godot script and scene smoke test
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --quit-after 2 --verbose 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' smoke.log; then
            echo "Godot reported a script or scene error"
            exit 1
          fi
      - name: Export APK
        id: export
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-debug 'Android' build/ZonaDePrueba.apk 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          echo "GODOT_EXPORT_EXIT=$code"
          if [ "$code" -eq 0 ] && [ -s build/ZonaDePrueba.apk ]; then touch export.ok; else exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZonaDePrueba-export-diagnostics
          path: |
            export.log
            build/ZonaDePrueba.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.export.outcome == 'success'
        with:
          name: ZonaDePrueba-Android-APK
          path: build/ZonaDePrueba.apk
          retention-days: 30
